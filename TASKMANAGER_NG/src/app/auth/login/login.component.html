<div class="container mt-5" style="max-width: 400px;">
  <h2 class="text-center mb-4">Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input
        type="email"
        id="email"
        class="form-control"
        formControlName="email"
        placeholder="Enter email"
      />
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger">
        Please enter a valid email.
      </div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        id="password"
        class="form-control"
        formControlName="password"
        placeholder="Enter password"
      />
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger">
        Password is required.
      </div>
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger mt-2">
      {{ errorMsg }}
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loginForm.invalid">
      Login
    </button>
  </form>
  <p class="text-center mt-3">
    Don't have an account?
    <a routerLink="/register">Register here</a>
  </p>
</div>
